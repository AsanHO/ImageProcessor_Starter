<svg xmlns="http://www.w3.org/2000/svg" width="900" height="690" viewBox="0 0 900 690" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif">
  <title>ImageProcessor 소스 파일 구조</title>
  <desc>main.cpp 가 인자 파싱, BMP 입출력, 필터 팩토리, 파이프라인, 로거를 사용하고, 파이프라인과 팩토리는 FilterBase 추상 클래스를 통해 5개의 필터 구현체를 다룬다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="900" height="690" fill="#FFFFFF"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2C2C2A">소스 파일 구조 (ImageProcessor/)</text>

  <!-- main -->
  <rect x="340" y="55" width="220" height="56" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="450" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#04342C">main.cpp</text>
  <text x="450" y="99" text-anchor="middle" font-size="12" fill="#0F6E56">진입점 · 예외 처리 · 종료 코드</text>

  <!-- main -> modules -->
  <line x1="450" y1="111" x2="110" y2="170" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="450" y1="111" x2="280" y2="170" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="450" y1="111" x2="450" y2="170" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="450" y1="111" x2="620" y2="170" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="450" y1="111" x2="790" y2="170" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- modules row -->
  <rect x="35" y="172" width="150" height="66" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="1.5"/>
  <text x="110" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#2C2C2A">CommandLineParser</text>
  <text x="110" y="212" text-anchor="middle" font-size="11" fill="#5F5E5A">.h / .cpp · 인자 파싱</text>
  <text x="110" y="228" text-anchor="middle" font-size="11" fill="#5F5E5A">--pipeline, --log 확장</text>

  <rect x="205" y="172" width="150" height="66" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="1.5"/>
  <text x="280" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#2C2C2A">BmpParser</text>
  <text x="280" y="212" text-anchor="middle" font-size="11" fill="#5F5E5A">.h / .cpp</text>
  <text x="280" y="228" text-anchor="middle" font-size="11" fill="#5F5E5A">BMP 읽기 · 쓰기</text>

  <rect x="375" y="172" width="150" height="66" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
  <text x="450" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#26215C">FilterFactory</text>
  <text x="450" y="212" text-anchor="middle" font-size="11" fill="#534AB7">.h / .cpp</text>
  <text x="450" y="228" text-anchor="middle" font-size="11" fill="#534AB7">문자열 → 필터 생성</text>

  <rect x="545" y="172" width="150" height="66" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
  <text x="620" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#26215C">FilterPipeline</text>
  <text x="620" y="212" text-anchor="middle" font-size="11" fill="#534AB7">.h / .cpp</text>
  <text x="620" y="228" text-anchor="middle" font-size="11" fill="#534AB7">필터 연결 · 순차 실행</text>

  <rect x="715" y="172" width="150" height="66" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
  <text x="790" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#26215C">Logger</text>
  <text x="790" y="212" text-anchor="middle" font-size="11" fill="#534AB7">.h / .cpp</text>
  <text x="790" y="228" text-anchor="middle" font-size="11" fill="#534AB7">로그 기록 · 시간 측정</text>

  <!-- factory / pipeline -> FilterBase -->
  <line x1="450" y1="238" x2="450" y2="318" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="460" y="285" font-size="11" fill="#5F5E5A">new 로 생성</text>
  <line x1="620" y1="238" x2="560" y2="318" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="598" y="285" font-size="11" fill="#5F5E5A">apply() 호출</text>
  <line x1="790" y1="238" x2="790" y2="290" stroke="#5F5E5A" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="798" y="270" font-size="11" fill="#5F5E5A">Pipeline 이 필터별</text>
  <text x="798" y="284" font-size="11" fill="#5F5E5A">시간·결과를 기록</text>

  <!-- FilterBase -->
  <rect x="310" y="320" width="280" height="62" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
  <text x="450" y="344" text-anchor="middle" font-size="15" font-weight="bold" fill="#26215C">FilterBase.h</text>
  <text x="450" y="363" text-anchor="middle" font-size="12" fill="#534AB7">추상 클래스 · apply(), name(), describe()</text>

  <!-- filters -> FilterBase (상속) -->
  <line x1="110" y1="450" x2="360" y2="383" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="280" y1="450" x2="400" y2="383" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="450" y1="450" x2="450" y2="383" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="620" y1="450" x2="500" y2="383" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="790" y1="450" x2="540" y2="383" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="35" y="395" font-size="12" fill="#5F5E5A">상속: 각 필터가 apply() 를 구현</text>

  <!-- filters row -->
  <rect x="35" y="452" width="150" height="70" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="110" y="476" text-anchor="middle" font-size="13" font-weight="bold" fill="#04342C">GrayscaleFilter</text>
  <text x="110" y="494" text-anchor="middle" font-size="11" fill="#0F6E56">.h / .cpp</text>
  <text x="110" y="510" text-anchor="middle" font-size="11" fill="#0F6E56">흑백 변환</text>

  <rect x="205" y="452" width="150" height="70" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="280" y="476" text-anchor="middle" font-size="13" font-weight="bold" fill="#04342C">ThresholdFilter</text>
  <text x="280" y="494" text-anchor="middle" font-size="11" fill="#0F6E56">.h / .cpp</text>
  <text x="280" y="510" text-anchor="middle" font-size="11" fill="#0F6E56">이진화</text>

  <rect x="375" y="452" width="150" height="70" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="450" y="472" text-anchor="middle" font-size="12" font-weight="bold" fill="#04342C">BrightnessContrast</text>
  <text x="450" y="487" text-anchor="middle" font-size="12" font-weight="bold" fill="#04342C">Filter</text>
  <text x="450" y="503" text-anchor="middle" font-size="11" fill="#0F6E56">.h / .cpp</text>
  <text x="450" y="517" text-anchor="middle" font-size="11" fill="#0F6E56">밝기 · 대비</text>

  <rect x="545" y="452" width="150" height="70" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="620" y="476" text-anchor="middle" font-size="13" font-weight="bold" fill="#04342C">ConvolutionFilter</text>
  <text x="620" y="494" text-anchor="middle" font-size="11" fill="#0F6E56">.h / .cpp</text>
  <text x="620" y="510" text-anchor="middle" font-size="11" fill="#0F6E56">Blur · Sharpen (멀티스레드)</text>

  <rect x="715" y="452" width="150" height="70" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="790" y="476" text-anchor="middle" font-size="13" font-weight="bold" fill="#04342C">FlipFilter</text>
  <text x="790" y="494" text-anchor="middle" font-size="11" fill="#0F6E56">.h / .cpp</text>
  <text x="790" y="510" text-anchor="middle" font-size="11" fill="#0F6E56">좌우 · 상하 반전</text>

  <!-- common bar -->
  <text x="35" y="560" font-size="12" fill="#5F5E5A">모든 모듈이 사용하는 공통 파일</text>
  <rect x="35" y="568" width="410" height="52" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="1.5"/>
  <text x="240" y="590" text-anchor="middle" font-size="13" font-weight="bold" fill="#2C2C2A">ImageBuffer.h / .cpp</text>
  <text x="240" y="608" text-anchor="middle" font-size="11" fill="#5F5E5A">픽셀 데이터 보관 (BGR, top-down)</text>
  <rect x="455" y="568" width="410" height="52" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="1.5"/>
  <text x="660" y="590" text-anchor="middle" font-size="13" font-weight="bold" fill="#2C2C2A">Exceptions.h</text>
  <text x="660" y="608" text-anchor="middle" font-size="11" fill="#5F5E5A">BmpParseError · FilterError · ArgumentError</text>

  <!-- legend -->
  <rect x="35" y="650" width="16" height="16" rx="3" fill="#F1EFE8" stroke="#888780" stroke-width="1.2"/>
  <text x="58" y="663" font-size="12" fill="#2C2C2A">제공된 코드</text>
  <rect x="160" y="650" width="16" height="16" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
  <text x="183" y="663" font-size="12" fill="#2C2C2A">직접 구현 (기본 요구사항)</text>
  <rect x="360" y="650" width="16" height="16" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
  <text x="383" y="663" font-size="12" fill="#2C2C2A">직접 구현 (고급 요구사항: 파이프라인 · OCP · 로그)</text>
</svg>
